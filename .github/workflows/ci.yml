name: SPanel Enterprise CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-and-security-suite:
    name: Backend, Security & Enterprise Verification (Ubuntu 24.04 + Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yara openssl shellcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Validate helper shell scripts syntax
        run: |
          bash -n installer/files/spanel-helper.sh
          bash -n installer/files/spanel-cron-jail.sh
          bash -n installer/install.sh
          bash -n installer/update.sh
          shellcheck --severity=error installer/files/spanel-helper.sh installer/files/spanel-cron-jail.sh installer/install.sh installer/update.sh

      - name: Run Phase 4 Enterprise Verification Suite (P0 / P1 / P2)
        env:
          SECRET_KEY: "ci-enterprise-test-secret-key-32-bytes-minimum-spanel"
        run: |
          python tests/test_phase4_enterprise.py

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: alembic upgrade head, single head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci-migrate.sqlite
        run: |
          python -m alembic upgrade head
          test "$(python -m alembic heads | wc -l)" -eq 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        # Same command install.sh uses. `npm ci` is not used because
        # package-lock.json is currently out of sync with package.json.
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build
        working-directory: frontend
        run: npm run build

  large-deletion-guard:
    name: Large deletion guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Code from one phase silently replaced code from the previous one twice
      # (commits 0f93eee and e8303e7) because files were overwritten from stale
      # copies. A PR that removes a large block from one backend or installer
      # file must say so with the allow-large-deletion label.
      - name: Check per-file deletions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'allow-large-deletion') }}
          LIMIT: "150"
        run: |
          flagged=$(git diff --numstat "$BASE_SHA"...HEAD -- backend/app installer frontend/src \
            | awk -v limit="$LIMIT" '$2 != "-" && $2 > limit { printf "%s (-%s lines)\n", $3, $2 }')
          if [ -z "$flagged" ]; then
            echo "No file loses more than $LIMIT lines."
            exit 0
          fi
          echo "Files losing more than $LIMIT lines:"
          echo "$flagged"
          if [ "$ALLOWED" = "true" ]; then
            echo "Label allow-large-deletion is set; continuing."
            exit 0
          fi
          echo "::error::Large deletions found. Check nothing was overwritten by mistake, then add the allow-large-deletion label."
          exit 1
